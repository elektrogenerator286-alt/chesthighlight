name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build --no-daemon

      - name: Publish jar as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chest Highlight build ${{ github.run_number }}
          body: "Готовый мод: скачайте файл chesthighlight-1.0.0.jar ниже и положите в папку mods."
          make_latest: true
          files: build/libs/chesthighlight-1.0.0.jar
